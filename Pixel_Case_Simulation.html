<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA CASE FILE // PIXEL PAGE FACTORY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#0b0e14;
    --panel:#1c2540;
    --panel-edge:#3a4a80;
    --panel-light:#2a3560;
    --accent-blue:#4da6ff;
    --accent-yellow:#ffd23f;
    --accent-red:#ff5a5f;
    --accent-green:#5fd068;
    --text-main:#f2f4ff;
    --text-dim:#8f9ac0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(77,166,255,.12) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(255,90,95,.10) 0%, transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
      #05070c;
    color:var(--text-main);
    font-family:'VT323',monospace;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .pixel-font{font-family:'Press Start 2P',cursive;}
  #consoleWrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  #marquee{
    font-family:'Press Start 2P',cursive; font-size:14px; letter-spacing:2px;
    color:var(--accent-yellow);
    text-shadow: 0 0 6px rgba(255,210,63,.9), 0 0 16px rgba(255,210,63,.5);
    background:linear-gradient(#1c2540,#0b0e14);
    padding:10px 22px; box-shadow: 0 0 0 3px var(--panel-edge), 0 6px 18px rgba(0,0,0,.6);
  }
  #marquee span{ color:var(--accent-blue); text-shadow:0 0 6px rgba(77,166,255,.9), 0 0 16px rgba(77,166,255,.5); }
  #stage{
    position:relative;
    width:980px;height:620px;
    background:var(--bg-dark);
    overflow:hidden;
    transform-origin:center center;
    box-shadow:
      0 0 0 4px #05070c,
      0 0 0 8px var(--panel-edge),
      0 0 0 12px #05070c,
      0 20px 60px rgba(0,0,0,.7);
  }
  #scanlines{
    position:absolute;inset:0;pointer-events:none;z-index:90;
    background:
      repeating-linear-gradient(rgba(0,0,0,.16) 0px, rgba(0,0,0,.16) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.4) 100%);
    mix-blend-mode:multiply;
  }
  #screen{ position:absolute; inset:0; display:flex; flex-direction:column; }

  /* ---------- generic menu-style screens ---------- */
  .menuscreen{ padding:20px 26px; height:100%; display:flex; flex-direction:column; animation: fadeIn .28s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .fade-in{ animation: fadeIn .28s ease; }
  .titlebar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:11px;letter-spacing:1px;color:var(--accent-yellow);
    border-bottom:3px solid var(--accent-yellow);
    box-shadow: 0 3px 10px -2px rgba(255,210,63,.4);
    padding-bottom:10px;margin-bottom:14px;
  }
  .btn{
    font-family:'Press Start 2P',cursive; font-size:11px;
    background:linear-gradient(160deg,#334072,#242f57); color:var(--text-main); border:none;
    border-left:4px solid var(--accent-yellow);
    padding:14px 16px; cursor:pointer; text-align:left;
    box-shadow: 4px 4px 0 #05070c, inset 0 0 0 2px var(--panel-edge);
    line-height:1.5; transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:hover{background:linear-gradient(160deg,#5fb4ff,#3d8fe0);color:#05070c;border-left-color:#05070c;transform:translate(-1px,-1px);box-shadow: 5px 5px 0 #05070c, inset 0 0 0 2px var(--panel-edge);}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #05070c;}
  .btn:disabled{opacity:.35;cursor:not-allowed;background:var(--panel-light);color:var(--text-dim);}
  .btn-row{display:flex;flex-direction:column;gap:10px;}
  .btn-small{font-size:9px;padding:9px 10px;}
  .panel{
    background:linear-gradient(160deg,#212b4d,#1a2340);
    box-shadow: inset 0 0 0 2px var(--panel-edge), inset 0 3px 0 var(--accent-yellow);
    padding:18px 20px;
  }
  .tag{display:inline-block;font-family:'Press Start 2P',cursive;font-size:9px;padding:4px 8px;background:var(--accent-red);color:#05070c;margin-right:6px;}
  .tag.green{background:var(--accent-green);} .tag.yellow{background:var(--accent-yellow);} .tag.blue{background:var(--accent-blue);}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:14px;}
  .name-plate{font-family:'Press Start 2P',cursive;font-size:10px;margin-bottom:8px;}
  .bodytext{font-size:20px;line-height:1.4;}
  .flex-fill{flex:1;overflow-y:auto;}
  .footer-row{margin-top:14px;display:flex;justify-content:flex-end;gap:10px;}
  .progress{display:flex;gap:6px;}
  .step{font-family:'Press Start 2P',cursive;font-size:8px;padding:6px 8px;background:var(--panel-light);color:var(--text-dim);}
  .step.active{background:var(--accent-yellow);color:#05070c;}
  .step.done{background:var(--accent-green);color:#05070c;}
  h1.pixel-font{font-size:22px;line-height:1.6;margin:0;color:var(--accent-yellow);text-shadow:3px 3px 0 #05070c;}
  h2.pixel-font{font-size:14px;color:var(--accent-blue);margin:0 0 10px 0;}
  .subtitle{font-size:16px;color:var(--text-dim);letter-spacing:1px;}
  @keyframes blinkFade{0%,100%{opacity:1;}50%{opacity:.15;}}
  .blink{animation:blinkFade 1.3s steps(1) infinite;}
  .clue-list{list-style:none;margin:0;padding:0;font-size:18px;}
  .clue-list li{padding:6px 0;border-bottom:1px dashed var(--panel-edge);}
  .clue-list li:before{content:"» ";color:var(--accent-green);}
  .modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:60;}
  .modal{
    background:var(--panel);box-shadow:0 0 0 3px var(--panel-edge), 8px 8px 0 #05070c;padding:26px;width:76%;max-width:600px;max-height:82%;overflow-y:auto;
    position:relative; animation: fadeIn .22s ease;
    background-image:
      linear-gradient(to right, var(--accent-yellow) 3px, transparent 3px),
      linear-gradient(to bottom, var(--accent-yellow) 3px, transparent 3px),
      linear-gradient(to left, var(--accent-yellow) 3px, transparent 3px),
      linear-gradient(to bottom, var(--accent-yellow) 3px, transparent 3px),
      linear-gradient(to left, var(--accent-yellow) 3px, transparent 3px),
      linear-gradient(to top, var(--accent-yellow) 3px, transparent 3px),
      linear-gradient(to right, var(--accent-yellow) 3px, transparent 3px),
      linear-gradient(to top, var(--accent-yellow) 3px, transparent 3px);
    background-repeat:no-repeat;
    background-size:18px 18px;
    background-position: top left, top left, top right, top right, bottom right, bottom right, bottom left, bottom left;
    background-color:var(--panel);
    background-origin:border-box;
  }
  .score-badge{
    font-family:'Press Start 2P',cursive;font-size:22px;padding:16px 22px;display:inline-block;
    box-shadow:4px 4px 0 #05070c; transform:rotate(-3deg);
    animation: stampIn .35s ease;
  }
  @keyframes stampIn{0%{transform:rotate(-3deg) scale(1.6); opacity:0;}100%{transform:rotate(-3deg) scale(1); opacity:1;}}
  .gold{background:var(--accent-yellow);color:#05070c;} .silver{background:#cfd6e6;color:#05070c;} .bronze{background:#c07a3f;color:#05070c;}
  table.spec{width:100%;border-collapse:collapse;font-size:18px;margin-top:8px;}
  table.spec td, table.spec th{border:2px solid var(--panel-edge);padding:6px 10px;text-align:left;}
  table.spec th{color:var(--accent-yellow);font-family:'Press Start 2P',cursive;font-size:9px;}
  .miniback-btn{font-family:'Press Start 2P',cursive;font-size:9px;background:var(--panel-light);color:var(--text-main);border:none;padding:7px 10px;cursor:pointer;box-shadow:2px 2px 0 #05070c;}

  /* ---------- hero image ---------- */
  .hero-svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto;shape-rendering:crispEdges;}
  @keyframes smokeRise{0%{transform:translateY(0);opacity:.85;}100%{transform:translateY(-26px);opacity:0;}}
  .smoke{animation:smokeRise 3s ease-out infinite;}
  @keyframes windowFlicker{0%,100%{opacity:1;}50%{opacity:.55;}}
  .winlight{animation:windowFlicker 2.6s ease-in-out infinite;}

  /* ---------- chart ---------- */
  .chartwrap{position:relative;background:var(--panel);box-shadow:inset 0 0 0 2px var(--panel-edge);height:200px;margin:12px 0;}
  .cline{position:absolute;left:0;right:0;height:0;border-top:2px dashed;}
  .clabel{position:absolute;right:6px;font-size:12px;font-family:'Press Start 2P',cursive;transform:translateY(-50%);}
  .dot{position:absolute;width:12px;height:12px;transform:translate(-50%,50%);}
  .dot.normal{background:var(--accent-green);}
  .dot.pending{background:var(--accent-red);}
  .dot.classified-common{background:var(--accent-yellow);}
  .dot.classified-special{background:var(--accent-red);}
  .dotnum{position:absolute;font-size:10px;font-family:'Press Start 2P',cursive;color:var(--text-dim);transform:translate(-50%,120%);}
  .reading-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--panel-edge);flex-wrap:wrap;}
  .reading-row .rlabel{width:150px;font-size:17px;}
  .reading-row .rbtns{display:flex;gap:8px;flex:1;}
  .reading-row .rresult{font-size:16px;flex:1;}

  /* ---------- ROOM / WORLD VIEW ---------- */
  #roomHud{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 20px; font-size:11px; color:var(--accent-yellow);
    border-bottom:3px solid var(--accent-yellow); background:linear-gradient(#151a2c,#05070c);
    box-shadow: 0 3px 10px -2px rgba(255,210,63,.4);
  }
  #peopleTracker{display:flex;gap:10px;font-family:'Press Start 2P',cursive;font-size:8px;}
  #peopleTracker span{padding:5px 7px;background:var(--panel-light);color:var(--text-dim);}
  #peopleTracker span.done{background:var(--accent-green);color:#05070c;}
  .hud-btn{font-family:'Press Start 2P',cursive;font-size:9px;background:linear-gradient(160deg,#334072,#242f57);color:var(--text-main);border:none;border-left:3px solid var(--accent-yellow);padding:6px 10px;cursor:pointer;box-shadow: 2px 2px 0 #05070c;margin-left:6px;}
  .hud-btn:hover{background:linear-gradient(160deg,#5fb4ff,#3d8fe0);color:#05070c;}
  #playArea{position:relative;flex:1;overflow:hidden;}
  .floor{position:absolute;left:0;right:0;bottom:0;height:74px;}
  .backwall{position:absolute;left:0;right:0;top:0;bottom:74px;}
  .prop{position:absolute;}
  .roomTitleSign{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-family:'Press Start 2P',cursive; font-size:13px; color:#05070c;
    background:var(--accent-yellow); padding:6px 14px; box-shadow:3px 3px 0 #05070c; letter-spacing:1px;
  }
  .edgehint{position:absolute;bottom:90px;font-size:26px;color:var(--text-dim);opacity:.55;animation:pulse 1.6s infinite;}
  .edgehint.left{left:8px;} .edgehint.right{right:8px;}
  @keyframes pulse{0%,100%{opacity:.25;}50%{opacity:.75;}}
  @keyframes sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  @keyframes gearspin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes beltScroll{from{background-position-x:0;}to{background-position-x:-60px;}}
  @keyframes forkbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @keyframes cursorblink{0%,100%{opacity:1;}50%{opacity:0;}}
  @keyframes idleBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

  .entity{position:absolute; bottom:44px; display:flex; flex-direction:column; align-items:center; }
  .entity .tokenwrap{ width:100px;height:120px; display:flex; align-items:flex-end;justify-content:center; }
  .entity .tokenwrap svg{ width:88px;height:auto; animation: idleBob 2.4s ease-in-out infinite; }
  .entity .elabel{margin-top:2px;font-size:14px;color:var(--text-dim);white-space:nowrap;font-weight:bold;}
  .entity.npc.talked .tokenwrap{ filter:drop-shadow(0 0 6px rgba(95,208,104,.9)); }
  .entity.in-range .tokenwrap, .entity.in-range .token{
    filter: drop-shadow(0 0 12px rgba(255,210,63,.95)) !important;
  }
  .entity.object{ bottom:44px; }
  .entity.object .token{
    width:60px;height:60px; display:flex;align-items:center;justify-content:center;font-size:30px;
    background:#3b2f22; box-shadow: inset 0 0 0 3px #05070c, 0 0 0 3px var(--panel-edge);
  }
  .entity.object.viewed .token{ box-shadow: inset 0 0 0 3px #05070c, 0 0 0 3px var(--accent-green); }
  .entity.object#ent_terminal .token::after{ content:''; }

  #larrySprite{ position:absolute; bottom:44px; width:100px; display:flex;flex-direction:column;align-items:center; }
  #larrySprite .tokenwrap{ width:100px;height:120px;display:flex;align-items:flex-end;justify-content:center; }
  #larrySprite .tokenwrap svg{ width:92px;height:auto; }
  #larrySprite .elabel{margin-top:2px;font-size:14px;color:var(--accent-yellow);font-weight:bold;}
  #larrySprite.walking .tokenwrap svg{ animation: bob .28s steps(2) infinite; }
  @keyframes bob{ 0%{transform:translateY(0);} 50%{transform:translateY(-6px);} 100%{transform:translateY(0);} }

  #talkBubble{
    position:absolute; bottom:150px; transform:translateX(-50%);
    font-family:'Press Start 2P',cursive; font-size:9px; background:var(--accent-green); color:#05070c;
    padding:5px 8px; box-shadow:2px 2px 0 #05070c; display:none; white-space:nowrap; z-index:20;
  }

  #dialogueLayer{
    display:none; position:absolute; left:14px; right:14px; bottom:14px; z-index:55;
    background:rgba(10,13,22,.94); box-shadow:0 0 0 3px var(--panel-edge), 6px 6px 0 #05070c;
    padding:16px 18px; gap:14px; align-items:flex-start;
  }
  #dialogueLayer .dlg-portrait{ width:60px;height:60px;flex:none; display:flex;align-items:center;justify-content:center; }
  #dialogueLayer .dlg-portrait svg{ width:56px;height:auto; }
  #dialogueLayer .dlg-body{ flex:1; }
  #dialogueLayer .dlg-name{ font-family:'Press Start 2P',cursive; font-size:10px; color:var(--accent-yellow); margin-bottom:6px; }
  #dialogueLayer .dlg-text{ font-size:21px; line-height:1.35; }
  #dialogueLayer .dlg-next{
    font-family:'Press Start 2P',cursive; font-size:10px; background:var(--accent-green); color:#05070c; border:none;
    padding:10px 12px; cursor:pointer; box-shadow:2px 2px 0 #05070c; flex:none; align-self:flex-end;
  }

  #controlsBar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:12px 20px; background:linear-gradient(#05070c,#151a2c); border-top:3px solid var(--accent-yellow);
    box-shadow: 0 -3px 10px -2px rgba(255,210,63,.35);
  }
  .dpad{display:flex;gap:10px;}
  .dpad button{
    font-family:'Press Start 2P',cursive; font-size:16px; width:56px;height:46px;
    background:linear-gradient(160deg,#334072,#242f57); color:var(--text-main); border:none;
    box-shadow: 3px 3px 0 #05070c, inset 0 0 0 2px var(--panel-edge); cursor:pointer;
  }
  .dpad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #05070c;}
  #actionBtn{
    font-family:'Press Start 2P',cursive;font-size:12px;
    background:var(--panel-light); color:var(--text-dim); border:none;
    padding:14px 18px; box-shadow: 3px 3px 0 #05070c, inset 0 0 0 2px var(--panel-edge); cursor:not-allowed;
  }
  #actionBtn.ready{background:var(--accent-green);color:#05070c;cursor:pointer;box-shadow: 3px 3px 0 #05070c, inset 0 0 0 2px #05070c;}
  #controlsHint{font-size:14px;color:var(--text-dim);}
  #toast{
    position:absolute; left:50%; top:70px; transform:translateX(-50%);
    background:var(--accent-red); color:#05070c; font-family:'Press Start 2P',cursive; font-size:10px;
    padding:8px 14px; box-shadow:3px 3px 0 #05070c; opacity:0; transition:opacity .25s ease; z-index:70; pointer-events:none;
    max-width:80%; text-align:center;
  }
  #toast.show{opacity:1;}

  /* checkboxes for final decision */
  .decision-check{ display:flex; align-items:flex-start; gap:12px; padding:12px; background:var(--panel-light); margin-bottom:10px; box-shadow: inset 0 0 0 2px var(--panel-edge); }
  .decision-check input{ width:22px;height:22px; accent-color:var(--accent-green); margin-top:2px; flex:none; }
  .decision-check .dc-text{font-size:19px;line-height:1.35;}
  .attempts-track{display:flex;gap:6px;}
  .attempts-track span{width:16px;height:16px;background:var(--panel-light);box-shadow:inset 0 0 0 2px var(--panel-edge);}
  .attempts-track span.used{background:var(--accent-red);}

  /* ---------- intro thinking scene ---------- */
  #introScene{position:relative;flex:1;overflow:hidden;}
  .thoughtbubble{
    position:absolute; left:440px; bottom:230px; transform:translateX(-30%);
    background:#f2f4ff; color:#05070c; box-shadow:0 0 0 3px #05070c, 6px 6px 0 rgba(0,0,0,.4);
    padding:14px 18px; font-family:'Press Start 2P',cursive; font-size:11px; line-height:2.1;
    animation: floatBubble 3s ease-in-out infinite;
  }
  .thoughtbubble .tb-dot{position:absolute;background:#f2f4ff;box-shadow:0 0 0 3px #05070c;border-radius:50%;}
  @keyframes floatBubble{0%,100%{transform:translateX(-30%) translateY(0);}50%{transform:translateX(-30%) translateY(-6px);}}
</style>
</head>
<body>
<div id="consoleWrap">
  <div id="marquee">◆ PIXEL PAGE FACTORY <span>QA CASE SIMULATOR</span> ◆</div>
  <div id="stage">
    <div id="screen"></div>
    <div id="scanlines"></div>
  </div>
</div>

<script>
/* ============================================================
   QA CASE FILE // PIXEL PAGE FACTORY
   Walk-around retro investigation game about root-cause analysis
   ============================================================ */

const screen = document.getElementById('screen');
function render(html){ screen.innerHTML = html; }

/* ---------------- responsive scaling ---------------- */
const stageEl = document.getElementById('stage');
function fitStage(){
  const s = Math.min(1, (window.innerWidth-16)/980, (window.innerHeight-76)/620);
  stageEl.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);
fitStage();

/* ---------------- pixel character generator ---------------- */
function personSvg(opts){
  const hat = opts.hat, skin = opts.skin || '#e7b98c', outfit = opts.outfit,
        pants = opts.pants || '#2b2f3d', accessory = opts.accessory || '';
  return `
  <svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
    <rect x="14" y="40" width="5" height="14" fill="${pants}"/>
    <rect x="21" y="40" width="5" height="14" fill="${pants}"/>
    <rect x="10" y="20" width="20" height="22" fill="${outfit}"/>
    <rect x="5" y="21" width="5" height="16" fill="${outfit}"/>
    <rect x="30" y="21" width="5" height="16" fill="${outfit}"/>
    <rect x="4" y="35" width="6" height="5" fill="${skin}"/>
    <rect x="30" y="35" width="6" height="5" fill="${skin}"/>
    <rect x="12" y="6" width="16" height="16" fill="${skin}"/>
    <rect x="12" y="2" width="16" height="6" fill="${hat}"/>
    <rect x="10" y="7" width="2" height="6" fill="${hat}"/>
    <rect x="28" y="7" width="2" height="6" fill="${hat}"/>
    <rect x="15" y="14" width="3" height="3" fill="#1a1c2c"/>
    <rect x="22" y="14" width="3" height="3" fill="#1a1c2c"/>
    ${accessory}
  </svg>`;
}
const CHAR_ART = {
  larry: personSvg({hat:'#4da6ff', outfit:'#2a3560', accessory:'<rect x="15" y="26" width="10" height="3" fill="#ffd23f"/>'}),
  nadia: personSvg({hat:'#3b2b52', outfit:'#c0763f', accessory:'<rect x="26" y="16" width="6" height="3" fill="#1a1c2c"/><rect x="29" y="14" width="3" height="6" fill="#1a1c2c"/>'}),
  hank:  personSvg({hat:'#ff9f2f', outfit:'#4a4f63', accessory:'<rect x="10" y="21" width="20" height="4" fill="#ffd23f"/>'}),
  priya: personSvg({hat:'#5fd068', outfit:'#8a6b45', accessory:'<rect x="30" y="30" width="8" height="10" fill="#f2f2f2"/><rect x="31" y="32" width="6" height="1" fill="#333"/><rect x="31" y="34" width="6" height="1" fill="#333"/>'})
};

/* ---------------- factory hero image ---------------- */
function factoryHeroSvg(){
  return `
  <svg class="hero-svg" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a2f66"/>
        <stop offset="55%" stop-color="#5a4a86"/>
        <stop offset="100%" stop-color="#d97757"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="480" height="160" fill="url(#sky)"/>
    <circle cx="60" cy="40" r="18" fill="#ffe9a8" opacity="0.9"/>
    <rect x="0" y="160" width="480" height="60" fill="#12141c"/>
    <rect x="40" y="70" width="260" height="100" fill="#33445c"/>
    <rect x="40" y="60" width="260" height="12" fill="#1c2540"/>

/* ---------------- current nearby target ---------------- */
let nearTarget = null;

function computeNearTarget(){
  const room = getRoom(state.currentRoom);
  let best = null, bestDist = Infinity;
  if(room.npc){
    const d = Math.abs(state.larryX - room.npc.x);
    if(d < bestDist){ bestDist = d; best = { type:'npc', data:room.npc }; }
  }
  if(room.objects){
    room.objects.forEach(o=>{
      const d = Math.abs(state.larryX - o.x);
      if(d < bestDist){ bestDist = d; best = { type:'object', data:o }; }
    });
  }
  return (best && bestDist <= TALK_RANGE) ? best : null;
}

/* ---------------- game loop ---------------- */
function gameTick(){
  requestAnimationFrame(gameTick);
  const larry = document.getElementById('larrySprite');
  if(!larry || dialogueActive) return;

  let dx = 0;
  if(keys.left) dx -= MOVE_SPEED;
  if(keys.right) dx += MOVE_SPEED;

  if(dx !== 0){
    state.larryX += dx;
    state.facing = dx < 0 ? 'left' : 'right';
    larry.classList.add('walking');
  } else {
    larry.classList.remove('walking');
  }

  const room = getRoom(state.currentRoom);

  if(state.larryX > ROOM_MAX_X){
    if(room.next){
      if(room.npc && !state.visited[room.npc.id]){
        state.larryX = ROOM_MAX_X;
        showToast(`Talk to ${room.npc.name} before heading out.`);
      } else {
        enterRoom(room.next, 'left');
        return;
      }
    } else {
      state.larryX = ROOM_MAX_X;
    }
  }
  if(state.larryX < ROOM_MIN_X){
    const prevId = getPrevRoomId(room.id);
    if(prevId){ enterRoom(prevId, 'right'); return; }
    else state.larryX = ROOM_MIN_X;
  }

  larry.style.left = state.larryX + 'px';
  larry.querySelector('.tokenwrap').style.transform = state.facing==='left' ? 'scaleX(-1)' : 'scaleX(1)';

  nearTarget = computeNearTarget();
  document.querySelectorAll('.entity').forEach(el=>el.classList.remove('in-range'));
  if(nearTarget){
    const el = document.getElementById('ent_' + nearTarget.data.id);
    if(el) el.classList.add('in-range');
  }
  const actionBtn = document.getElementById('actionBtn');
  const bubble = document.getElementById('talkBubble');
  if(nearTarget){
    const isNpc = nearTarget.type === 'npc';
    const already = isNpc ? state.visited[nearTarget.data.id] :
                     (nearTarget.data.id==='terminal' ? false : state.viewedObjects[nearTarget.data.id]);
    actionBtn.classList.add('ready');
    actionBtn.textContent = isNpc ? (already ? 'TALK AGAIN' : 'TALK') :
                             (nearTarget.data.id==='terminal' ? 'USE' : (already ? 'VIEW AGAIN' : 'VIEW'));
    if(bubble){
      bubble.style.display = 'block';
      bubble.style.left = nearTarget.data.x + 'px';
      bubble.textContent = isNpc ? '💬 TALK' : '🔍 VIEW';
    }
  } else if(actionBtn) {
    actionBtn.classList.remove('ready');
    actionBtn.textContent = '…';
    if(bubble) bubble.style.display = 'none';
  }
}
requestAnimationFrame(gameTick);

/* ---------------- interactions ---------------- */
function handleAction(){
  if(!nearTarget) return;
  if(nearTarget.type === 'npc') startNpcDialogue(nearTarget.data);
  else startObjectInteraction(nearTarget.data);
}

/* dialogue plays as an overlay ON TOP of the current room — background never disappears */
function playScript(art, who, role, lines, onComplete, finalLabel){
  let i = 0;
  dialogueActive = true;
  function step(){
    const layer = document.getElementById('dialogueLayer');
    if(!layer) return;
    const isLast = i === lines.length - 1;
    layer.style.display = 'flex';
    layer.innerHTML = `
      <div class="dlg-portrait">${CHAR_ART[art] || ''}</div>
      <div class="dlg-body">
        <div class="dlg-name">${who}${role ? ' — '+role : ''}</div>
        <div class="dlg-text">${lines[i]}</div>
      </div>
      <button class="dlg-next" onclick="advanceScript()">${isLast ? (finalLabel || 'OK ▶') : 'NEXT ▶'}</button>
    `;
  }
  window.advanceScript = function(){
    i++;
    if(i < lines.length) step();
    else {
      window.advanceScript = null;
      dialogueActive = false;
      const layer = document.getElementById('dialogueLayer');
      if(layer){ layer.style.display='none'; layer.innerHTML=''; }

const history = [79,81,78,80,82,79,83,80,81,79,80];
const lastMonth = [86,88,87,89,86];
const USL=90, LSL=70, UCL=85, LCL=75;
const chartMin=68, chartMax=92;
function yPos(val){ return ((val - chartMin) / (chartMax - chartMin)) * 100; }

function showChartIntro(){
  render(`
    <div class="menuscreen">
      <div class="titlebar"><span>QA TERMINAL</span>${progressSteps(1)}${factoryReturnBtn()}</div>
      <div class="panel flex-fill">

        <p class="bodytext">Official spec since 2024: <span class="tag red">70–90 gsm</span> pass / fail.<br>
        The QA lab also tracks natural process variation with tighter <span class="tag yellow">control limits (75–85 gsm)</span> —
        the range the supplier's process normally wobbles inside when nothing unusual is happening.</p>
        <p class="bodytext">For each of <b>last month's five readings</b> below the chart, decide: normal noise, or a sign something changed?</p>
      </div>
      <div class="footer-row"><button class="btn pixel-font" onclick="showChart()">OPEN THE CHART ▶</button></div>
    </div>
  `);
}

function showChart(){
  const totalMonths = history.length + lastMonth.length;
  let dots = "";
  history.forEach((v,i)=>{
    const x = ((i+0.5)/totalMonths)*100;
    dots += `<div class="dot normal" style="left:${x}%;bottom:${yPos(v)}%;" title="${v} gsm"></div>`;
  });
  lastMonth.forEach((v,i)=>{
    const idx = history.length + i;
    const x = ((idx+0.5)/totalMonths)*100;
    const result = state.dotResults[i];
    const cls = result ? (result.correct === 'special' ? 'classified-special' : 'classified-common') : 'pending';
    dots += `<div class="dot ${cls}" style="left:${x}%;bottom:${yPos(v)}%;" title="${v} gsm"></div>`;
    dots += `<div class="dotnum" style="left:${x}%;bottom:0;">${i+1}</div>`;
  });

  let rows = "";
  lastMonth.forEach((v,i)=>{
    const result = state.dotResults[i];
    if(result){
      const isRight = result.guess === result.correct;
      rows += `
        <div class="reading-row">
          <div class="rlabel">Reading #${i+1}: <b>${v} gsm</b></div>
          <div class="rresult" style="color:${isRight?'var(--accent-green)':'var(--accent-red)'};">
            ${isRight ? '✅' : '❌'} ${classifyFeedback(v, result.correct, isRight)}
          </div>
        </div>`;
    } else {
      rows += `
        <div class="reading-row">
          <div class="rlabel">Reading #${i+1}: <b>${v} gsm</b></div>
          <div class="rbtns">
            <button class="btn btn-small" onclick="submitReading(${i},${v},'common')">😌 Common cause</button>
            <button class="btn btn-small" onclick="submitReading(${i},${v},'special')">🚨 Special cause</button>
          </div>
        </div>`;
    }
  });

  render(`
    <div class="menuscreen">
      <div class="titlebar"><span>PAPER THICKNESS CONTROL CHART</span>${progressSteps(1)}${factoryReturnBtn()}</div>
      <div class="chartwrap">
        <div class="cline" style="bottom:${yPos(USL)}%;border-color:var(--accent-red);"></div>
        <div class="clabel" style="bottom:${yPos(USL)}%;color:var(--accent-red);">USL 90</div>
        <div class="cline" style="bottom:${yPos(UCL)}%;border-color:var(--accent-yellow);"></div>
        <div class="clabel" style="bottom:${yPos(UCL)}%;color:var(--accent-yellow);">UCL 85</div>
        <div class="cline" style="bottom:${yPos(LCL)}%;border-color:var(--accent-yellow);"></div>
        <div class="clabel" style="bottom:${yPos(LCL)}%;color:var(--accent-yellow);">LCL 75</div>
        <div class="cline" style="bottom:${yPos(LSL)}%;border-color:var(--accent-red);"></div>
        <div class="clabel" style="bottom:${yPos(LSL)}%;color:var(--accent-red);">LSL 70</div>
        ${dots}
      </div>
      <div class="bodytext" style="margin:6px 0 10px;">
        <span class="tag green">green</span> = older months &nbsp;
        <span class="tag red">numbered</span> = last month — classify each below (${state.chartDone}/5)
      </div>
      <div class="flex-fill">${rows}</div>
      <div class="footer-row">
        <button class="btn pixel-font" ${state.chartDone < 5 ? 'disabled' : ''} onclick="chartWrapup()">CONTINUE ▶</button>
      </div>
    </div>
  `);
}

function classifyFeedback(val, correct, isRight){
  if(isRight){
    return correct === 'special'
      ? `${val} gsm is inside the 70–90 spec, but above the 85 gsm control limit — a real process shift.`
      : `${val} gsm sits comfortably inside the normal process range — nothing unusual.`;
  }
  return correct === 'special'
    ? `Actually a special cause: ${val} gsm is above the 85 gsm control limit, even though it's under the 90 spec limit.`
    : `Actually common cause: ${val} gsm is within the normal 75–85 range.`;
}

function submitReading(i, val, guess){
  if(state.dotResults[i]) return;
  const correct = val > UCL || val < LCL ? 'special' : 'common';
  if(guess === correct) state.chartScore += 2;
  state.chartDone += 1;
  state.dotResults[i] = { guess, correct };
  showChart();
}

function composeFeedback(sel){

    ? "Reviewing and tightening the paper specification with the supplier attacks the true root cause, so the defect pattern shouldn't recur."
    : "Without addressing the paper thickness drift, the same defect pattern is likely to come right back next month.");
  return parts.join(' ');
}

function evaluateFinal(sel){
  if(sel.retailer && !sel.recalibrate && sel.paperSpec){

      text:"Approving TechMart's full claim is right for the relationship, but without fixing the paper specification, the same defect pattern will keep recurring — you'll be back here again next month, and repeated defects will eventually strain the relationship anyway." };

      <li><b>Tell common cause from special cause before you act.</b> Normal day-to-day noise (common cause) needs no reaction.
      A real shift (special cause) — like paper drifting above its usual range — needs investigation, even if it still "passes."</li>
      <li><b>Fix the root cause, not the nearest symptom.</b> The machines were the visible, expensive lever to pull, but pulling it
      would have left the actual driver (incoming paper thickness) untouched.</li>
      <li><b>Don't spend against unverified assumptions.</b> "Better safe than sorry" isn't a substitute for evidence. A quick
      capability check would have shown the machines didn't need touching, before anyone committed $310,000.</li>
      <li><b>Quality decisions carry a relationship cost, not just a technical one.</b> A full, immediate, no-hedging approval
      on a confirmed defect protects the account and the brand — a partial or conditional offer can look like stalling on a bill
      you're going to pay anyway, and that friction is what pushes a client toward a backup supplier.</li>
    </ol>
  `;
}
function openKeyLearnings(){
  const bg = screen.innerHTML;
  render(`
    <div class="modal-bg"><div class="modal">
      ${keyLearningsHtml()}
      <div class="footer-row"><button class="btn pixel-font" onclick="restoreScreen()">CLOSE ▶</button></div>
    </div></div>
  ` + bg);
  window.restoreScreen = ()=>{ window.restoreScreen=null; render(bg); };
}

/* ================= ENDING ================= */
function showEnding(solvedCorrectly){
  let badgeClass, badgeTitle;
  if(solvedCorrectly && state.finalAttempts===1){ badgeClass="gold"; badgeTitle="MASTER QUALITY DETECTIVE"; }
  else if(solvedCorrectly && state.finalAttempts===2){ badgeClass="silver"; badgeTitle="SKILLED INVESTIGATOR"; }
  else if(solvedCorrectly){ badgeClass="bronze"; badgeTitle="PERSISTENT INVESTIGATOR"; }
  else { badgeClass="bronze"; badgeTitle="CASE CLOSED — REVIEWED WITH MENTOR"; }

  render(`
    <div class="menuscreen">
      <div class="titlebar">
        <span>CASE REPORT</span>
        ${progressSteps(3)}
        <button class="hud-btn" onclick="openKeyLearnings()">🔑 KEY LEARNINGS</button>
      </div>
      <div class="flex-fill">
        <div class="center" style="gap:10px;">
          <div class="score-badge ${badgeClass}">${badgeTitle}</div>
          <p class="bodytext">Final call took ${state.finalAttempts} attempt${state.finalAttempts===1?'':'s'}<br>
          <span style="color:var(--text-dim);">Chart accuracy: ${state.chartScore}/10 — correct classifications of last month's 5 paper readings (2 pts each)</span></p>
        </div>
        <div class="panel" style="margin-top:12px;">
          <h2 class="pixel-font">WHAT ACTUALLY HAPPENED</h2>
          <p class="bodytext">Last month's paper shipment ran hotter than usual — <b>above the supplier's normal 75–85 gsm range</b>,
          even though it still passed the official 70–90 gsm spec from 2024. That's a <b>special-cause drift hiding inside a
          technically-compliant batch.</b></p>
          <p class="bodytext">The binding and cutting lines, calibrated last year around a thinner average, met paper that was
          consistently thicker than they were tuned for — producing jams, cracked spines, and warped covers on 1,500 units.</p>
          <p class="bodytext"><b>The right call:</b> approve TechMart's full credit note immediately to protect the relationship and brand image,
          and fix the paper specification with the supplier to remove the root cause. The machines never needed recalibrating.
          Tap <b>🔑 KEY LEARNINGS</b> above for the full reasoning and the five takeaways from this case.</p>
        </div>
      </div>
      <div class="footer-row"><button class="btn pixel-font" onclick="showTitle()">◀ PLAY AGAIN</button></div>
    </div>
  `);
}

/* ---------------- BOOT ---------------- */
showTitle();
</script>
